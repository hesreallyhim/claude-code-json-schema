name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm ci

      - name: Compile schemas (Ajv strict)
        run: npm run compile

      - name: Validate synthetic fixtures
        run: npm run validate:fixtures
