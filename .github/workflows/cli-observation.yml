name: CLI Observation

on:
  pull_request:
    paths:
      - "fixtures/**"
      - "schemas/**"
      - "docs/FIXTURE-EVIDENCE.json"
      - "tools/validate-fixtures-claude.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/cli-observation.yml"
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

jobs:
  observe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm ci

      - name: Validate fixtures against Claude CLI
        id: cli_validate
        continue-on-error: ${{ github.event_name == 'schedule' }}
        run: npm run validate:fixtures:claude

      - name: Upsert drift issue (scheduled runs)
        if: ${{ github.event_name == 'schedule' && steps.cli_validate.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const title = "CLI drift detected by scheduled observation";
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const branch = context.ref.replace("refs/heads/", "");
            const now = new Date().toISOString();

            const body = [
              "Scheduled `validate:fixtures:claude` detected drift.",
              "",
              `- Detected at: ${now}`,
              `- Branch: ${branch}`,
              `- Workflow run: ${runUrl}`,
              "",
              "This signal is observational and non-blocking for scheduled runs.",
              "Review fixture expectations and CLI behavior, then update evidence/status as needed."
            ].join("\n");

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "open",
              per_page: 100
            });

            const existing = issues.find((issue) => issue.title === title);

            if (existing) {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: existing.number,
                body
              });
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body: `Another drift run failed: ${runUrl}`
              });
              core.info(`Updated existing drift issue #${existing.number}.`);
            } else {
              const created = await github.rest.issues.create({
                owner,
                repo,
                title,
                body
              });
              core.info(`Created drift issue #${created.data.number}.`);
            }
